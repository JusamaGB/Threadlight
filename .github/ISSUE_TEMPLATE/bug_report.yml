name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real transcripts, thread titles or anything private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: threadlight
    attributes:
      label: Threadlight version
      description: The package.json version and Git commit, if built from source.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Affected provider and app or CLI version
      description: For example Codex, ChatGPT, Claude Code or Perplexity. Include versions if known.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
