<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Agent captions</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        font:
          12px/16px 'Segoe UI Variable',
          'Segoe UI',
          sans-serif;
        color: #fafafa;
      }
      #pill {
        width: max-content;
        max-width: 100%;
        padding: 4px 10px 6px;
        border: 1px solid #55525e;
        border-top: none;
        border-radius: 0 0 10px 10px;
        background: rgba(26, 25, 29, 0.96);
        box-shadow: 0 2px 4px #0003;
        animation: enter 130ms ease-out;
      }
      #words {
        max-height: 32px;
        overflow: hidden;
        text-align: center;
        overflow-wrap: anywhere;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pill {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="pill"><div id="words" role="status" aria-label="Agent speaking"></div></div>
  </body>
</html>
